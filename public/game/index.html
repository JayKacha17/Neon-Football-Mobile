<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Screen - Neon Football</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050510; color: white; font-family: 'Segoe UI', sans-serif; }
        #game-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        
        /* Lobby UI */
        #lobby-screen { position: absolute; width: 100%; height: 100%; background: rgba(10, 10, 26, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; }
        .join-panel { display: flex; align-items: center; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 20px; border: 2px solid #00ffcc; box-shadow: 0 0 30px rgba(0,255,204,0.3); backdrop-filter: blur(10px); }
        .qr-container { background: white; padding: 15px; border-radius: 10px; margin-right: 40px; }
        .room-info { text-align: center; }
        .room-code { font-size: 5rem; font-weight: bold; letter-spacing: 5px; color: #00ffcc; text-shadow: 0 0 20px #00ffcc; margin: 0; }
        .instruction { font-size: 1.5rem; color: #ccc; }
        
        .players-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 50px; width: 80%; }
        .player-card { width: 150px; height: 200px; background: rgba(0,0,0,0.5); border: 2px solid #555; border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s; }
        .player-card.active { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.5); }
        .player-avatar { width: 80px; height: 80px; border-radius: 50%; background: #333; margin-bottom: 15px; border: 3px solid transparent; }
        .player-name { font-size: 1.2rem; font-weight: bold; }
        
        #start-btn { margin-top: 40px; padding: 15px 50px; font-size: 2rem; background: transparent; color: white; border: 3px solid #ff00ff; border-radius: 50px; cursor: pointer; text-transform: uppercase; font-weight: bold; pointer-events: auto; transition: all 0.3s; }
        #start-btn:hover:not(:disabled) { background: #ff00ff; box-shadow: 0 0 30px #ff00ff; transform: scale(1.05); }
        #start-btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; }
        
        /* Game UI */
        #scoreboard { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 10px 40px; border-radius: 0 0 20px 20px; border: 2px solid #00ffcc; border-top: none; display: flex; align-items: center; gap: 30px; font-size: 2.5rem; font-weight: bold; display: none; }
        .team-a { color: #00ffcc; }
        .team-b { color: #ff00ff; }
        .timer { font-family: monospace; font-size: 2rem; }
        
        #announcer { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 6rem; font-weight: bold; text-align: center; text-transform: uppercase; text-shadow: 0 0 30px currentColor; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="lobby-screen">
            <h1 style="font-size: 3rem; margin-bottom: 40px; text-shadow: 0 0 20px #00ffcc;">PARTY LOBBY</h1>
            
            <div class="join-panel">
                <div class="qr-container" id="qrcode"></div>
                <div class="room-info">
                    <p class="instruction">Scan to join or enter code at<br><b><span id="join-url"></span></b></p>
                    <p class="room-code" id="room-code-display">----</p>
                </div>
            </div>
            
            <div class="players-grid" id="players-container">
                <!-- Player cards injected here -->
            </div>
            
            <!-- Match Duration Selector -->
            <div id="duration-selector" style="margin-top: 30px; display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 1.2rem; font-weight: bold; color: #00ffcc; text-transform: uppercase; letter-spacing: 1px;">Match Time:</span>
                <button type="button" class="duration-btn" data-time="60" style="padding: 10px 18px; font-size: 1.1rem; border-radius: 20px; border: 2px solid #555; background: rgba(0,0,0,0.5); color: #fff; cursor: pointer; font-weight: bold; transition: all 0.2s;">1 MIN</button>
                <button type="button" class="duration-btn" data-time="120" style="padding: 10px 18px; font-size: 1.1rem; border-radius: 20px; border: 2px solid #555; background: rgba(0,0,0,0.5); color: #fff; cursor: pointer; font-weight: bold; transition: all 0.2s;">2 MIN</button>
                <button type="button" class="duration-btn active" data-time="180" style="padding: 10px 18px; font-size: 1.1rem; border-radius: 20px; border: 2px solid #00ffcc; background: rgba(0,255,204,0.25); color: #00ffcc; cursor: pointer; font-weight: bold; box-shadow: 0 0 15px rgba(0,255,204,0.4); transition: all 0.2s;">3 MIN</button>
                <button type="button" class="duration-btn" data-time="300" style="padding: 10px 18px; font-size: 1.1rem; border-radius: 20px; border: 2px solid #555; background: rgba(0,0,0,0.5); color: #fff; cursor: pointer; font-weight: bold; transition: all 0.2s;">5 MIN</button>
            </div>
            
            <button id="start-btn" disabled>Waiting for players...</button>
        </div>
        
        <div id="scoreboard">
            <span class="team-a">TEAM A</span>
            <span class="score-a" id="score-a">0</span>
            <span class="timer" id="timer">03:00</span>
            <span class="score-b" id="score-b">0</span>
            <span class="team-b">TEAM B</span>
        </div>
        
        <div id="announcer">GOAL!</div>
    </div>

    <!-- Scripts (100% Offline Bundled) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/libs/qrcode.min.js"></script>
    <script src="/libs/three.min.js"></script>
    <script src="/libs/matter.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
